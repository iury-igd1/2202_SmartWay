<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">SmartWay — mobilidade que se ouve e se sente</title>
  <desc id="desc">Banner azul escuro com o nome SmartWay, uma pulseira, um ônibus e um trajeto com paradas.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061633"/>
      <stop offset="0.55" stop-color="#08244b"/>
      <stop offset="1" stop-color="#0b3b75"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17d8e5"/>
      <stop offset="1" stop-color="#1894ff"/>
    </linearGradient>
    <linearGradient id="strap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16558d"/>
      <stop offset="0.5" stop-color="#1d79b8"/>
      <stop offset="1" stop-color="#104477"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#3d77a9" stroke-width="1" opacity="0.17"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#background)"/>
  <path d="M 720 0 H 1200 V 420 H 720 Z" fill="url(#grid)"/>
  <path d="M 720 0 V 420" stroke="#2a669b" opacity="0.34"/>

  <!-- Marca: uma rota contínua dentro de um S geométrico. -->
  <rect x="60" y="57" width="80" height="80" rx="22" fill="#0c396b" stroke="#1a9bed" stroke-width="2"/>
  <path d="M 110 78 H 88 C 77 78 72 86 72 94 C 72 102 79 108 90 108 H 106 C 117 108 122 115 122 123" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="110" cy="78" r="5" fill="#8ef8e8"/>
  <circle cx="122" cy="123" r="5" fill="#8ef8e8"/>
  <text x="159" y="113" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" letter-spacing="-2">Smart<tspan fill="#32c8f3">Way</tspan></text>

  <text x="60" y="211" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="700" letter-spacing="-0.7">Mobilidade que se ouve.</text>
  <text x="60" y="256" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="700" letter-spacing="-0.7">Segurança que se sente.</text>
  <text x="61" y="297" fill="#b9d9ef" font-family="Arial, Helvetica, sans-serif" font-size="19">Uma pulseira para orientar viagens de ônibus.</text>

  <rect x="61" y="350" width="4" height="18" rx="2" fill="#27ccef"/>
  <text x="78" y="365" fill="#82dcfa" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2">VOZ  ·  VIBRAÇÃO  ·  AUTONOMIA</text>

  <rect x="944" y="47" width="190" height="33" rx="16.5" fill="#123d6b" stroke="#286295"/>
  <text x="1039" y="69" text-anchor="middle" fill="#cae7fa" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">PROJETE 2025</text>

  <!-- O trajeto liga três paradas a um ônibus em movimento. -->
  <path d="M 754 308 C 815 308 825 244 879 244 S 958 190 1013 190 S 1083 125 1140 125" fill="none" stroke="#10d6df" stroke-width="19" opacity="0.22" filter="url(#glow)"/>
  <path d="M 754 308 C 815 308 825 244 879 244 S 958 190 1013 190 S 1083 125 1140 125" fill="none" stroke="#40ccef" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 11"/>
  <circle cx="754" cy="308" r="14" fill="#0b2c56" stroke="#47ddea" stroke-width="4"/>
  <circle cx="879" cy="244" r="14" fill="#0b2c56" stroke="#47ddea" stroke-width="4"/>
  <circle cx="1013" cy="190" r="14" fill="#0b2c56" stroke="#47ddea" stroke-width="4"/>
  <circle cx="1140" cy="125" r="14" fill="#0b2c56" stroke="#47ddea" stroke-width="4"/>

  <!-- Pulseira e visor: símbolo do dispositivo, sem depender de imagens externas. -->
  <g transform="translate(894 216) rotate(-18)">
    <rect x="-36" y="-98" width="72" height="196" rx="28" fill="url(#strap)" stroke="#42a5d3" stroke-width="3"/>
    <rect x="-47" y="-46" width="94" height="92" rx="22" fill="#071b37" stroke="#65dbef" stroke-width="4"/>
    <rect x="-30" y="-28" width="60" height="56" rx="12" fill="#0c375d"/>
    <path d="M -20 2 H -10 L -4 -11 L 4 14 L 11 -2 H 20" fill="none" stroke="#73f0e5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(1065 255)">
    <rect x="-65" y="-40" width="130" height="72" rx="15" fill="#188dde" stroke="#8ce8fb" stroke-width="3"/>
    <rect x="-49" y="-25" width="42" height="27" rx="4" fill="#b1eaff"/>
    <rect x="4" y="-25" width="42" height="27" rx="4" fill="#b1eaff"/>
    <rect x="-40" y="32" width="22" height="9" rx="4" fill="#06254b"/>
    <rect x="20" y="32" width="22" height="9" rx="4" fill="#06254b"/>
    <circle cx="-37" cy="16" r="5" fill="#e0fbff"/>
    <circle cx="37" cy="16" r="5" fill="#e0fbff"/>
  </g>

  <text x="965" y="373" fill="#88d9f7" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">TECNOLOGIA ASSISTIVA</text>
</svg>
